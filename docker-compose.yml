services:
  postgres:
    image: postgres:16-alpine
    container_name: reports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reports_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: reports_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reports_api
    restart: unless-stopped
    command: npm start
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reports_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      STORAGE_DIR: /app/storage/reports
    ports:
      - "3000:3000"
    volumes:
      - reports_storage:/app/storage/reports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reports_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      STORAGE_DIR: /app/storage/reports
      WORKER_DELAY_SECONDS: 5
      WORKER_ID: worker
      MAX_RETRIES: 3
    volumes:
      - reports_storage:/app/storage/reports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reports_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  rabbitmq_data:
  reports_storage:
